<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Everyone knows time didn't start till 1900!</title>
<meta name="theme-color" content="#f3f2ef">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #f3f2ef;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- the void ---------- */
  .void {
    position: fixed; inset: -30%;
    z-index: 0;
    pointer-events: none;
    filter: blur(60px);
  }
  .void span {
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: multiply;
  }
  .void span:nth-child(1) {
    width: 70vmax; height: 70vmax; left: 10%; top: 5%;
    background: radial-gradient(circle, #e9e6e0 0%, transparent 65%);
    animation: drift1 70s ease-in-out infinite alternate;
  }
  .void span:nth-child(2) {
    width: 60vmax; height: 60vmax; right: 5%; top: 20%;
    background: radial-gradient(circle, #e4e7ec 0%, transparent 65%);
    animation: drift2 90s ease-in-out infinite alternate;
  }
  .void span:nth-child(3) {
    width: 65vmax; height: 65vmax; left: 30%; bottom: 0%;
    background: radial-gradient(circle, #ece8e4 0%, transparent 65%);
    animation: drift3 80s ease-in-out infinite alternate;
  }
  .void span:nth-child(4) {
    width: 50vmax; height: 50vmax; left: 40%; top: 30%;
    background: radial-gradient(circle, #ffffff 0%, transparent 60%);
    mix-blend-mode: screen;
    animation: drift1 55s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift1 { to { transform: translate(18vw, 12vh) scale(1.25); } }
  @keyframes drift2 { to { transform: translate(-22vw, 16vh) scale(.85); } }
  @keyframes drift3 { to { transform: translate(-10vw, -20vh) scale(1.15); } }

  .grain {
    position: fixed; inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: .05;
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- stage ---------- */
  main {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2vh;
    padding: 2vh 12px;
  }

  #toy {
    width: min(94vw, 980px);
    max-height: 80vh;
    height: auto;
    touch-action: none;
    overflow: visible;
  }
  #toy.wrong { animation: shudder .55s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shudder {
    15% { transform: translateX(-7px) rotate(-.3deg); }
    30% { transform: translateX(7px) rotate(.3deg); }
    45% { transform: translateX(-5px); }
    60% { transform: translateX(4px); }
    75% { transform: translateX(-2px); }
  }

  .bead, .cube { cursor: grab; }
  .bead.dragging, .cube.dragging { cursor: grabbing; }
  .sel-ring { opacity: 0; transition: opacity .2s; }
  .selected .sel-ring { opacity: 1; }
  .cube-face { transform-box: fill-box; transform-origin: center; }
  .cube-face.spin { animation: spin .28s ease-in-out; }
  @keyframes spin {
    0% { transform: scaleY(1); }
    50% { transform: scaleY(.04); }
    100% { transform: scaleY(1); }
  }

  #tag { transition: opacity .15s; }
  #tag.hidden { opacity: 0; pointer-events: none; }
  #tag .arrow { cursor: pointer; }
  #tag .arrow:hover rect { fill: rgba(0,0,0,.06); }

  /* ---------- button ---------- */
  #checkBtn {
    position: relative;
    overflow: hidden;
    border: none;
    border-radius: 999px;
    padding: 15px 34px;
    font: 700 16px 'Inter', system-ui, sans-serif;
    letter-spacing: -.01em;
    color: #fff;
    background: linear-gradient(180deg, #2c2a2e, #18171a);
    box-shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 10px 30px rgba(20,18,22,.25), 0 2px 6px rgba(20,18,22,.2);
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, opacity .3s;
  }
  #checkBtn:hover { transform: translateY(-1px); box-shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 14px 36px rgba(20,18,22,.3), 0 2px 6px rgba(20,18,22,.2); }
  #checkBtn:active { transform: translateY(1px); }
  #checkBtn.busy { animation: breathe 1s ease-in-out infinite; pointer-events: none; }
  @keyframes breathe { 50% { opacity: .6; } }
  #checkBtn.no { animation: nope .45s ease; }
  @keyframes nope {
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(3px); }
  }
  /* cooldown: a bar drains across the button */
  #checkBtn.cool { pointer-events: none; opacity: .55; }
  #checkBtn .bar {
    position: absolute; left: 0; bottom: 0;
    height: 3px; width: 0;
    background: rgba(255,255,255,.7);
  }

  /* ---------- the poem ---------- */
  #hintBtn {
    position: fixed;
    right: 18px; bottom: 12px;
    z-index: 10;
    width: 36px; height: 36px;
    border: none;
    background: none;
    font: italic 400 24px 'Cormorant Garamond', Georgia, serif;
    color: #1d1c20;
    opacity: .09;
    cursor: pointer;
    transition: opacity .8s ease;
  }
  #hintBtn:hover, #hintBtn:focus-visible { opacity: .32; outline: none; }

  #poem {
    position: fixed; inset: 0;
    z-index: 30;
    display: grid;
    place-items: center;
    padding: 6vh 8vw;
    background: rgba(243, 242, 239, .74);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .9s ease;
    cursor: pointer;
  }
  #poem.open { opacity: 1; pointer-events: all; }
  #poem .verse {
    max-width: 62ch;
    font: italic 300 clamp(17px, 2.1vw, 27px)/1.5 'Cormorant Garamond', Georgia, serif;
    color: #2a2730;
    letter-spacing: .005em;
  }
  #poem .verse span {
    display: block;
    margin-bottom: .55em;
    padding-left: 1.4em;
    text-indent: -1.4em;
    opacity: 0;
    transform: translateY(6px);
    filter: blur(3px);
    transition: opacity 1.1s ease, transform 1.1s ease, filter 1.1s ease;
  }
  #poem.open .verse span { opacity: 1; transform: none; filter: none; }
  #poem .verse span i {
    display: inline-block;
    width: .55em; height: .55em;
    margin-right: .7em;
    border-radius: 50%;
    vertical-align: .08em;
  }
  #poem .rule {
    width: 28px; height: 1px;
    margin: 0 auto 4.5vh;
    background: #2a2730;
    opacity: 0;
    transition: opacity 1.4s ease .2s;
  }
  #poem.open .rule { opacity: .25; }
   #poem .gap {
    width: 28px; height: 1px;
    margin: 1.1em 0 1.6em 1.4em;
    background: #2a2730;
    opacity: 0;
    transition: opacity 1.1s ease;
  }
  #poem.open .gap { opacity: .2; }

  /* ---------- exit ---------- */
  #white {
    position: fixed; inset: 0;
    z-index: 50;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.4s ease;
  }
  #white.on { opacity: 1; pointer-events: all; }

  /* ---------- author helper: only at #solution ---------- */
  #solution {
    display: none;
    position: fixed;
    right: 12px; bottom: 12px;
    z-index: 40;
    width: 300px;
  }
  #solution textarea {
    width: 100%;
    height: 220px;
    font: 11px 'JetBrains Mono', monospace;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: rgba(255,255,255,.9);
    user-select: text;
    -webkit-user-select: text;
  }

  @media (prefers-reduced-motion: reduce) {
    .void span { animation: none !important; }
  }
</style>
</head>

<script>
/* ================================================================= */
const API = "https://door.drsp1cy.com";

/* ================================================================= */
/* SOUND: effects are synthesized; music is background.mp3 next to this page */
const MUSIC_VOLUME = 0.35;
const sfx = (() => {
  let ctx = null, master = null, muted = false, last = 0;
  const music = new Audio("background.mp3");
  music.loop = true;
  music.volume = 0;
  music.preload = "auto";
  let musicStarted = false, fadeTimer = null;

  function fadeMusic(to, ms) {
    clearInterval(fadeTimer);
    const from = music.volume, t0 = performance.now();
    fadeTimer = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / ms);
      music.volume = Math.max(0, Math.min(1, from + (to - from) * k));
      if (k === 1) clearInterval(fadeTimer);
    }, 50);
  }

  function unlock() {
    if (!ctx) {
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain();
        master.gain.value = muted ? 0 : 0.9;
        master.connect(ctx.destination);
      } catch (e) {}
    }
    if (ctx && ctx.state === "suspended") ctx.resume();
    if (!musicStarted) {
      musicStarted = true;
      music.play().then(() => fadeMusic(muted ? 0 : MUSIC_VOLUME, 3000)).catch(() => { musicStarted = false; });
    }
  }
  ["pointerdown", "keydown"].forEach(ev => window.addEventListener(ev, unlock, { capture: true }));

  document.addEventListener("visibilitychange", () => {
    if (!musicStarted) return;
    if (document.hidden) music.pause(); else music.play().catch(() => {});
  });

  /* building blocks */
  function noise(dur) {
    const b = ctx.createBuffer(1, Math.max(1, ctx.sampleRate * dur), ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = b;
    return src;
  }
  function env(g, t, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  /* a wooden knock: filtered noise + a quick dropping tone */
  function knock(freq, vol = 0.3, dur = 0.08) {
    if (!ctx || muted) return;
    const t = ctx.currentTime;
    const n = noise(dur), bp = ctx.createBiquadFilter(), ng = ctx.createGain();
    bp.type = "bandpass"; bp.frequency.value = freq * 2.2; bp.Q.value = 6;
    env(ng, t, vol, dur * 0.7);
    n.connect(bp).connect(ng).connect(master);
    n.start(t); n.stop(t + dur);
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * 0.6, t + dur);
    env(og, t, vol * 0.8, dur);
    o.connect(og).connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function tone(freq, start, dur, vol, type = "sine") {
    const t = ctx.currentTime + start;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }

  const PITCH = { teal: 1500, red: 1150, cube: 700 };

  return {
    /* a bead or cube passing a stop; throttled so fast drags purr instead of buzz */
    tick(kind) {
      if (!ctx || muted) return;
      const now = performance.now();
      if (now - last < 28) return;
      last = now;
      knock(PITCH[kind] * (0.94 + Math.random() * 0.12), 0.07, 0.03);
    },
    pick()  { knock(520, 0.22, 0.07); },
    drop()  { knock(380, 0.28, 0.1); },
    turn()  { knock(620, 0.25, 0.06); setTimeout(() => knock(460, 0.3, 0.09), 90); },
    press() { knock(300, 0.18, 0.06); },
    wrong() {
      if (!ctx || muted) return;
      tone(140, 0, 0.22, 0.25, "triangle");
      tone(104, 0.16, 0.32, 0.25, "triangle");
    },
    cool()  { if (ctx && !muted) tone(220, 0, 0.18, 0.12, "sine"); },
    hint()  {
      if (!ctx || muted) return;
      tone(659.25, 0, 1.4, 0.05, "sine");
      tone(987.77, 0.12, 1.6, 0.035, "sine");
    },
    win() {
      if (!ctx || muted) return;
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, k) => {
        tone(f, k * 0.11, 1.6, 0.16, "sine");
        tone(f * 2, k * 0.11, 0.9, 0.04, "sine");
      });
      fadeMusic(0, 1400);
    },
    toggleMute() {
      muted = !muted;
      if (master) master.gain.value = muted ? 0 : 0.9;
      fadeMusic(muted ? 0 : MUSIC_VOLUME, 600);
    }
  };
})();

const WIRES = {
  teal: { stops: 365, shownFrom: 1 },
  red:  { stops: 127, shownFrom: 0 }
};

/* Pairs: teal bead N and red bead N look identical. Order = poem line order. */
const PAIRS = [
  { c: "#f08a3c", g: "☻" },               // 1
  { c: "#f6f4f1", g: "◕", dark: true },   // 2
  { c: "#2aa3c9" },                       // 3
  { c: "#f5cf2a", g: "✦", dark: true },   // 4
  { c: "#9bd13c" },                       // 5
  { c: "#5b6b8c", g: "☾" },               // 6
  { c: "#8a5cc7" }                        // 7
];
const BEADS = { teal: PAIRS, red: PAIRS };

const POEM = [
  "Mirrors watched as paper closed the war to end all wars;",
  "seven thousand islands lit up fireworks that weren\u2019t theirs;",
  "a world of blocks shed beta on the day it came of age;",
  "the doctor woke as all the zeros rolled across the page;",
  "the smallest switch first whispered in a lab of phones and wire;",
  "a harbor saw a second dawn, a morning made of fire;",
  "a ballroom held its breath for words that never found their end."
];
 
const POEM_2 = [
  "Where do Datacats even come from?",
  "Forget this, im moving to Shikotan..."
];
 
const SHOW_PAIR_MARKS = false;   // true = a coloured dot before each line shows which pair it belongs to

const CUBES = [
  { stops: 91,  shownFrom: 0, c: "#e2445c", side: "#9e2236" },
  { stops: 181, shownFrom: 0, c: "#e2445c", side: "#9e2236" },
  { stops: 91,  shownFrom: 0, c: "#2c8fd6", side: "#1a5a8c" },
  { stops: 181, shownFrom: 0, c: "#2c8fd6", side: "#1a5a8c" }
];
const FACES = ["▲", "▶", "▼", "◀"];

/* ================================================================= */
const START = () => ({
  teal: [292, 304, 316, 328, 340, 352, 364],
  red:  [0, 2, 4, 6, 8, 10, 12],
  cubes: { pos: [0, 0, 0, 0], face: [0, 0, 0, 0] }
});

let state = load() || START();
let selected = null;

function load() {
  try {
    const s = JSON.parse(localStorage.getItem("playtime-v4"));
    if (s && s.teal?.length === 7 && s.red?.length === 7 && s.cubes?.pos?.length === CUBES.length
        && s.teal.every(v => v >= 0 && v < WIRES.teal.stops)
        && s.red.every(v => v >= 0 && v < WIRES.red.stops)
        && s.cubes.pos.every((v, i) => v >= 0 && v < CUBES[i].stops)) return s;
  } catch (e) {}
  return null;
}
function save() {
  try { localStorage.setItem("playtime-v4", JSON.stringify(state)); } catch (e) {}
  if (location.hash === "#solution") document.getElementById("solOut").value = JSON.stringify(state, null, 2);
}

/* ================================================================= */
const svg = document.getElementById("toy");
const NS = "http://www.w3.org/2000/svg";

function stopPoints(path, n) {
  const L = path.getTotalLength();
  const a = 30, b = L - 30;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const p = path.getPointAtLength(a + (b - a) * i / (n - 1));
    pts.push({ x: p.x, y: p.y });
  }
  return pts;
}
WIRES.teal.points = stopPoints(document.getElementById("wireTeal"), WIRES.teal.stops);
WIRES.red.points  = stopPoints(document.getElementById("wireRed"),  WIRES.red.stops);
WIRES.teal.layer = document.getElementById("beadsTeal");
WIRES.red.layer  = document.getElementById("beadsRed");

function svgPoint(e) {
  const p = svg.createSVGPoint();
  p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}

/* rods */
const CUBE = 42;
const ROD_X0 = 178, ROD_W = 644;
const TRACK = ROD_W - CUBE;
const ROD_Y = [626, 678, 730, 782];

const rodLayer = document.getElementById("rods");
ROD_Y.forEach(y => {
  const g = document.createElementNS(NS, "g");
  g.innerHTML = `
    <rect x="${ROD_X0}" y="${y + 4}" width="${ROD_W}" height="10" rx="5" fill="#2a2018" opacity=".14" filter="url(#glow)"/>
    <rect x="${ROD_X0}" y="${y - 6}" width="${ROD_W}" height="12" rx="6" fill="url(#rod)" filter="url(#grainH)"/>
    <rect x="${ROD_X0}" y="${y - 4}" width="${ROD_W}" height="2" rx="1" fill="#fff" opacity=".55"/>`;
  rodLayer.appendChild(g);
});

const cubeX = (i, v) => ROD_X0 + TRACK * v / (CUBES[i].stops - 1);
const cubeY = i => ROD_Y[i] - CUBE / 2 - 2;

/* ================================================================= */
const beadEls = { teal: [], red: [] };

function buildBeads(wire) {
  BEADS[wire].forEach((b, i) => {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "bead");
    const ink = b.dark ? "#2a2a33" : "#fff";
    const body = b.g
      ? `<rect x="-24" y="-21" width="48" height="42" rx="14" fill="${b.c}"/>
         <rect x="-24" y="-21" width="48" height="42" rx="14" fill="url(#gloss)"/>
         <rect x="-24" y="-21" width="48" height="42" rx="14" fill="none" stroke="#000" stroke-opacity=".12"/>
         <text x="0" y="8" text-anchor="middle" font-size="22" font-weight="800" fill="${ink}"
           font-family="Inter, sans-serif" opacity=".92">${b.g}</text>
         <ellipse cx="-11" cy="-12" rx="8" ry="3.5" fill="#fff" opacity=".55"/>`
      : `<circle r="22" fill="${b.c}"/>
         <circle r="22" fill="url(#gloss)"/>
         <circle r="22" fill="none" stroke="#000" stroke-opacity=".12"/>
         <ellipse cx="-8" cy="-10" rx="7" ry="4" fill="#fff" opacity=".6" transform="rotate(-30,-8,-10)"/>`;
    g.innerHTML = `
      <circle class="sel-ring" r="32" fill="none" stroke="#1d1c20" stroke-width="2" stroke-dasharray="3 5" opacity=".5"/>
      <g filter="url(#soft)">${body}</g>`;
    WIRES[wire].layer.appendChild(g);
    beadEls[wire].push(g);
    dragBead(g, wire, i);
  });
}

function placeBead(wire, i) {
  const p = WIRES[wire].points[state[wire][i]];
  beadEls[wire][i].setAttribute("transform", `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
}
function placeAllBeads() {
  for (const w of ["teal", "red"]) state[w].forEach((_, i) => placeBead(w, i));
}

function dragBead(el, wire, i) {
  let active = false;
  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    e.stopPropagation();
    select({ kind: "bead", wire, i });
    sfx.pick();
    el.setPointerCapture(e.pointerId);
    el.classList.add("dragging");
    active = true;
  });
  el.addEventListener("pointermove", e => {
    if (!active) return;
    const p = svgPoint(e);
    const pts = WIRES[wire].points;
    const d = s => (pts[s].x - p.x) ** 2 + (pts[s].y - p.y) ** 2;
    let v = state[wire][i];
    const before = v;
    for (let guard = 0; guard < 2000; guard++) {
      if (v > 0 && d(v - 1) < d(v)) v--;
      else if (v < pts.length - 1 && d(v + 1) < d(v)) v++;
      else break;
    }
    state[wire][i] = v;
    if (v !== before) sfx.tick(wire);
    placeBead(wire, i);
    refreshTag();
  });
  const end = () => {
    if (!active) return;
    active = false;
    el.classList.remove("dragging");
    sfx.drop();
    save();
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

/* ================================================================= */
const cubeEls = [];

function buildCubes() {
  const layer = document.getElementById("cubes");
  CUBES.forEach((c, i) => {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "cube");
    g.innerHTML = `
      <rect class="sel-ring" x="-6" y="-6" width="${CUBE + 12}" height="${CUBE + 16}" rx="10"
        fill="none" stroke="#1d1c20" stroke-width="2" stroke-dasharray="3 5" opacity=".5"/>
      <g filter="url(#soft)">
        <rect x="2" y="5" width="${CUBE}" height="${CUBE}" rx="6" fill="${c.side}"/>
        <g class="cube-face">
          <rect width="${CUBE}" height="${CUBE}" rx="6" fill="${c.c}"/>
          <rect width="${CUBE}" height="${CUBE}" rx="6" fill="url(#cubeGloss)"/>
          <rect x="1.5" y="1.5" width="${CUBE - 3}" height="${CUBE - 3}" rx="5" fill="none" stroke="#fff" stroke-opacity=".35"/>
          <text x="${CUBE / 2}" y="${CUBE / 2 + 7}" text-anchor="middle" font-size="20" font-weight="800"
            fill="#fff" font-family="Inter, sans-serif"></text>
        </g>
      </g>`;
    layer.appendChild(g);
    cubeEls.push(g);
    dragCube(g, i);
  });
}

function placeCube(i, spin = false) {
  const el = cubeEls[i];
  el.setAttribute("transform", `translate(${cubeX(i, state.cubes.pos[i]).toFixed(1)},${cubeY(i)})`);
  const txt = el.querySelector("text");
  const face = FACES[state.cubes.face[i]];
  if (spin) {
    const f = el.querySelector(".cube-face");
    f.classList.remove("spin"); void f.getBBox(); f.classList.add("spin");
    setTimeout(() => { txt.textContent = face; }, 140);
  } else {
    txt.textContent = face;
  }
}
function placeAllCubes() { CUBES.forEach((_, i) => placeCube(i)); }

function turnCube(i) {
  state.cubes.face[i] = (state.cubes.face[i] + 1) % 4;
  sfx.turn();
  placeCube(i, true);
  save();
}

function dragCube(el, i) {
  let startX = null, startLeft = 0, moved = false;
  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    e.stopPropagation();
    select({ kind: "cube", i });
    sfx.pick();
    el.setPointerCapture(e.pointerId);
    el.classList.add("dragging");
    startX = svgPoint(e).x;
    startLeft = cubeX(i, state.cubes.pos[i]);
    moved = false;
  });
  el.addEventListener("pointermove", e => {
    if (startX === null) return;
    const dx = svgPoint(e).x - startX;
    if (Math.abs(dx) > 6) moved = true;
    if (!moved) return;
    const n = CUBES[i].stops;
    const v = Math.max(0, Math.min(n - 1, Math.round((startLeft + dx - ROD_X0) / TRACK * (n - 1))));
    if (v !== state.cubes.pos[i]) sfx.tick("cube");
    state.cubes.pos[i] = v;
    placeCube(i);
    refreshTag();
  });
  const end = () => {
    if (startX === null) return;
    startX = null;
    el.classList.remove("dragging");
    if (!moved) turnCube(i);
    else { sfx.drop(); save(); }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", () => { startX = null; el.classList.remove("dragging"); });
}

/* ================================================================= */
const tag = document.getElementById("tag");
const tagText = document.getElementById("tagText");

function selEl(s) { return s.kind === "bead" ? beadEls[s.wire][s.i] : cubeEls[s.i]; }

function select(s) {
  if (selected) selEl(selected).classList.remove("selected");
  selected = s;
  if (!s) { tag.classList.add("hidden"); return; }
  const el = selEl(s);
  el.classList.add("selected");
  if (s.kind === "bead") el.parentNode.appendChild(el);
  refreshTag();
}

function refreshTag() {
  if (!selected) return;
  let x, y, val;
  if (selected.kind === "bead") {
    const { wire, i } = selected;
    const p = WIRES[wire].points[state[wire][i]];
    x = p.x; y = p.y - 52;
    val = state[wire][i] + WIRES[wire].shownFrom;
  } else {
    const { i } = selected;
    x = cubeX(i, state.cubes.pos[i]) + CUBE / 2;
    y = cubeY(i) - 26;
    val = state.cubes.pos[i] + CUBES[i].shownFrom;
  }
  x = Math.max(70, Math.min(930, x));
  if (y < 26) y += 104;
  tag.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)})`);
  tagText.textContent = val;
  tag.classList.remove("hidden");
}

function nudge(dir, big = false) {
  if (!selected) return;
  const step = dir * (big ? 10 : 1);
  if (selected.kind === "bead") {
    const { wire, i } = selected;
    state[wire][i] = Math.max(0, Math.min(WIRES[wire].stops - 1, state[wire][i] + step));
    placeBead(wire, i);
  } else {
    const { i } = selected;
    state.cubes.pos[i] = Math.max(0, Math.min(CUBES[i].stops - 1, state.cubes.pos[i] + step));
    placeCube(i);
  }
  sfx.tick(selected.kind === "bead" ? selected.wire : "cube");
  refreshTag();
  save();
}

/* tag arrows: tap to step, hold to run */
function holdRepeat(el, dir) {
  let t1 = null, t2 = null;
  const stop = () => { clearTimeout(t1); clearInterval(t2); };
  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    e.stopPropagation();
    nudge(dir);
    t1 = setTimeout(() => { t2 = setInterval(() => nudge(dir), 55); }, 380);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => el.addEventListener(ev, stop));
}
holdRepeat(document.getElementById("tagPrev"), -1);
holdRepeat(document.getElementById("tagNext"), 1);

/* tap empty space to put the piece down */
svg.addEventListener("pointerdown", e => {
  if (!e.target.closest(".bead, .cube, #tag")) select(null);
});

window.addEventListener("keydown", e => {
  if ((e.key === "m" || e.key === "M") && !e.target.closest("textarea, input")) { sfx.toggleMute(); return; }
  if (!selected || e.target.closest("textarea, input")) return;
  if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); nudge(-1, e.shiftKey); }
  if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); nudge(1, e.shiftKey); }
  if ((e.key === "r" || e.key === "R" || e.key === "Enter") && selected.kind === "cube") turnCube(selected.i);
  if (e.key === "Escape") select(null);
});

/* ================================================================= */
const checkBtn = document.getElementById("checkBtn");
const bar = checkBtn.querySelector(".bar");

function no() {
  checkBtn.classList.remove("no"); void checkBtn.offsetWidth; checkBtn.classList.add("no");
}

checkBtn.onclick = async () => {
  sfx.press();
  checkBtn.classList.add("busy");
  try {
    const res = await fetch(`${API}/check`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state)
    });
    const data = await res.json().catch(() => ({}));
    checkBtn.classList.remove("busy");

    if (res.status === 429) {
      const secs = data.retryAfter || 60;
      sfx.cool();
      checkBtn.classList.add("cool");
      bar.style.transition = "none";
      bar.style.width = "100%";
      requestAnimationFrame(() => requestAnimationFrame(() => {
        bar.style.transition = `width ${secs}s linear`;
        bar.style.width = "0";
      }));
      setTimeout(() => checkBtn.classList.remove("cool"), secs * 1000);
    } else if (data.ok && data.url) {
      sfx.win();
      document.getElementById("white").classList.add("on");
      setTimeout(() => { location.href = data.url; }, 2200);
    } else if (res.ok) {
      sfx.wrong();
      svg.classList.remove("wrong"); void svg.getBBox(); svg.classList.add("wrong");
    } else {
      no();
    }
  } catch (e) {
    checkBtn.classList.remove("busy");
    no();
  }
};

/* ================================================================= */
const poem = document.getElementById("poem");
const verse = document.getElementById("verse");
POEM.forEach((line, k) => {
  const span = document.createElement("span");
  if (SHOW_PAIR_MARKS) {
    const dot = document.createElement("i");
    dot.style.background = PAIRS[k].c;
    dot.style.boxShadow = "inset 0 0 0 1px rgba(0,0,0,.15)";
    span.appendChild(dot);
  }
  span.appendChild(document.createTextNode(line));
  span.style.transitionDelay = `${0.35 + k * 0.22}s`;
  verse.appendChild(span);
});
 const gap = document.createElement("div");
gap.className = "gap";
gap.style.transitionDelay = `${0.35 + POEM.length * 0.22}s`;
verse.appendChild(gap);
POEM_2.forEach((line, k) => {
  const span = document.createElement("span");
  if (SHOW_PAIR_MARKS) {
    const dot = document.createElement("i");
    dot.style.background = CUBES[k * 2].c;
    dot.style.boxShadow = "inset 0 0 0 1px rgba(0,0,0,.15)";
    span.appendChild(dot);
  }
  span.appendChild(document.createTextNode(line));
  span.style.transitionDelay = `${0.35 + (POEM.length + 1 + k) * 0.22}s`;
  verse.appendChild(span);
});
function openPoem() {
  select(null);
  sfx.hint();
  poem.classList.add("open");
}
function closePoem() { poem.classList.remove("open"); }
document.getElementById("hintBtn").addEventListener("click", e => { e.stopPropagation(); openPoem(); });
poem.addEventListener("click", closePoem);
window.addEventListener("keydown", e => { if (e.key === "Escape" && poem.classList.contains("open")) closePoem(); }, true);

/* ================================================================= */
if (location.hash === "#solution") document.getElementById("solution").style.display = "block";

buildBeads("teal"); buildBeads("red");
buildCubes();
placeAllBeads();
placeAllCubes();
save();
</script>
</body>
</html>
