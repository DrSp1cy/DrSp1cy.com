<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>denial</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,500&family=Chewy&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><rect width='10' height='10' fill='%23000'/></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body.began { cursor: none; }

  #beginWrap {
    position: fixed; inset: 0;
    z-index: 10;
    display: grid; place-items: center;
    pointer-events: none;
  }
  #begin {
    position: relative;
    pointer-events: auto;
    padding: 34px 64px 30px;
    border: 5px solid #1a1a1a;
    border-radius: 58% 42% 55% 45% / 48% 60% 40% 52%;
    background: linear-gradient(135deg, #ff5fd2, #ffd23f 45%, #3fffa2 75%, #4fc3ff);
    background-size: 300% 300%;
    box-shadow: 8px 10px 0 #1a1a1a, inset -6px -8px 0 rgba(0,0,0,.12);
    font-family: "Chewy", "Comic Sans MS", "Comic Sans", cursive;
    font-size: clamp(42px, 7vw, 84px);
    letter-spacing: .04em;
    color: #fff;
    -webkit-text-stroke: 3px #1a1a1a;
    paint-order: stroke fill;
    text-shadow: 4px 4px 0 #1a1a1a;
    cursor: pointer;
    animation: wobble 2.4s ease-in-out infinite, blob 5s ease-in-out infinite, rainbow 6s linear infinite;
    transition: scale .15s ease;
  }
  #begin:hover { scale: 1.08; animation-duration: .9s, 2s, 2s; }
  #begin:active { scale: .9 1.1; }
  #begin .word { display: inline-block; }
  #begin .word i {
    display: inline-block;
    font-style: normal;
    animation: hop 1.2s ease-in-out infinite;
  }
  #begin .word i:nth-child(2) { animation-delay: .1s; }
  #begin .word i:nth-child(3) { animation-delay: .2s; }
  #begin .word i:nth-child(4) { animation-delay: .3s; }
  #begin .word i:nth-child(5) { animation-delay: .4s; }
  #begin .eyes {
    position: absolute; left: 50%; top: -34px;
    transform: translateX(-50%);
    display: flex; gap: 6px;
  }
  #begin .eye {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: #fff;
    border: 4px solid #1a1a1a;
    position: relative;
  }
  #begin .eye:nth-child(2) { width: 38px; height: 38px; margin-top: 6px; }
  #begin .pupil {
    position: absolute; left: 50%; top: 50%;
    width: 18px; height: 18px;
    margin: -9px 0 0 -9px;
    border-radius: 50%;
    background: #1a1a1a;
    transition: transform .08s linear;
  }
  #begin.gone {
    animation: boing .7s cubic-bezier(.5, -0.6, .7, .2) forwards;
    pointer-events: none;
  }
  @keyframes wobble {
    0%, 100% { rotate: -4deg; }
    50% { rotate: 4deg; }
  }
  @keyframes blob {
    0%, 100% { border-radius: 58% 42% 55% 45% / 48% 60% 40% 52%; }
    33% { border-radius: 40% 60% 45% 55% / 60% 42% 58% 40%; }
    66% { border-radius: 55% 45% 38% 62% / 42% 55% 45% 58%; }
  }
  @keyframes rainbow { to { background-position: 300% 300%; } }
  @keyframes hop {
    0%, 60%, 100% { transform: translateY(0) rotate(0); }
    30% { transform: translateY(-10px) rotate(-6deg); }
  }
  @keyframes boing {
    0%   { scale: 1; rotate: 0deg; opacity: 1; }
    25%  { scale: 1.3 .7; }
    45%  { scale: .8 1.3; }
    100% { scale: 0; rotate: 540deg; opacity: 0; }
  }

  #quote {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.6em;
    padding: 0 8vw;
    text-align: center;
    font-family: "Cormorant Garamond", "Garamond", "Georgia", serif;
    font-style: italic;
    color: #ece6da;
    pointer-events: none;
    transition: opacity 1.2s ease, filter 1.2s ease;
  }
  #quote.gone { opacity: 0; filter: blur(6px); }
  #line {
    font-weight: 300;
    font-size: clamp(26px, 4.4vw, 64px);
    line-height: 1.25;
    letter-spacing: .01em;
    text-shadow: 0 0 24px rgba(255,235,200,.18);
  }
  #line span {
    opacity: 0;
    filter: blur(5px);
    display: inline-block;
    transform: translateY(.12em);
    transition: opacity .7s ease, filter .7s ease, transform .7s ease;
    white-space: pre;
  }
  #line span.on { opacity: 1; filter: blur(0); transform: none; }
  #line .caret {
    display: inline-block;
    width: 1px; height: .9em;
    margin-left: .08em;
    vertical-align: -.08em;
    background: #ece6da;
    opacity: 0;
  }
  #line .caret.blink { animation: caret 1s steps(1) infinite; }
  @keyframes caret { 0%, 100% { opacity: .7; } 50% { opacity: 0; } }
  #who {
    font-weight: 500;
    font-size: clamp(14px, 1.5vw, 22px);
    letter-spacing: .32em;
    text-transform: uppercase;
    font-style: normal;
    color: #b9ae9b;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 2s ease, transform 2s ease;
  }
  #who.on { opacity: .85; transform: none; }
  #who::before, #who::after {
    content: "";
    display: inline-block;
    width: 2.2em; height: 1px;
    margin: 0 .9em;
    vertical-align: .3em;
    background: currentColor;
    opacity: .5;
  }

  #stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    perspective: 1400px;
    opacity: 0;
  }
  body.revealed #stage { opacity: 1; }

  #spot {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 55% 60% at 50% 48%, rgba(255,245,230,.10), transparent 70%);
    opacity: 0;
    transition: opacity 4s ease;
    pointer-events: none;
  }
  body.revealed #spot { opacity: 1; }

  .card {
    grid-area: 1 / 1;
    position: relative;
    height: min(82vh, 82vw * 1.328);
    aspect-ratio: 1088 / 1445;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .card img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 6px;
    box-shadow: 0 30px 90px rgba(0,0,0,.9), 0 0 60px rgba(255,240,220,.08);
    animation: develop 3.2s ease-out both paused;
    -webkit-user-drag: none;
  }
  .card.on img { animation-play-state: running; }
  #frame2 { opacity: 0; }
  #frame2.on { opacity: 1; }
  @keyframes develop {
    0%   { filter: brightness(4) contrast(.6) blur(6px); }
    35%  { filter: brightness(1.6) contrast(.9) blur(1px); }
    100% { filter: brightness(1) contrast(1) blur(0); }
  }
  .sheen {
    position: absolute; inset: 0;
    border-radius: 6px;
    overflow: hidden;
    pointer-events: none;
  }
  .sheen::after {
    content: "";
    position: absolute; top: -20%; bottom: -20%;
    width: 40%;
    left: -60%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.13), transparent);
    transform: skewX(-12deg);
    animation: sheen 9s ease-in-out 3s infinite;
  }
  @keyframes sheen { 0% { left: -60%; } 30%, 100% { left: 130%; } }

  #flash {
    position: fixed; inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }
  #flash.go { animation: flash 2.2s cubic-bezier(.1, .7, .3, 1) forwards; }
  #flash.go2 { animation: flash2 1.6s cubic-bezier(.1, .7, .3, 1) forwards; }
  @keyframes flash2 {
    0%   { opacity: 0; }
    4%   { opacity: .9; }
    12%  { opacity: .9; }
    100% { opacity: 0; }
  }
  @keyframes flash {
    0%   { opacity: 0; }
    3%   { opacity: 1; }
    14%  { opacity: 1; }
    100% { opacity: 0; }
  }
  body.shake #stage { animation: shake .45s linear; }
  @keyframes shake {
    0%, 100% { translate: 0 0; }
    20% { translate: -10px 6px; }
    40% { translate: 8px -7px; }
    60% { translate: -6px -4px; }
    80% { translate: 4px 5px; }
  }

  .vignette {
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.75) 100%);
  }
  .grain {
    position: fixed; inset: 0;
    pointer-events: none;
    opacity: .06;
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  @media (prefers-reduced-motion: reduce) {
    .sheen::after { animation: none; }
    body.shake #stage { animation: none; }
  }
</style>
</head>
<body>

<div id="beginWrap"><button id="begin"><span class="eyes"><span class="eye"><span class="pupil"></span></span><span class="eye"><span class="pupil"></span></span></span><span class="word"><i>b</i><i>e</i><i>g</i><i>i</i><i>n</i></span></button></div>
<div id="quote">
  <div id="line"></div>
  <div id="who">Thomas Jefferson</div>
</div>
<div id="spot"></div>
<div id="stage">
  <div class="card" id="frame">
    <img src="truth.png" alt="" id="truth">
    <div class="sheen"></div>
  </div>
  <div class="card" id="frame2">
    <img src="truth2.png" alt="" id="truth2">
    <div class="sheen"></div>
  </div>
</div>
<div class="vignette"></div>
<div class="grain"></div>
<div id="flash"></div>

<audio id="music" src="piano.mp3" preload="auto"></audio>

<script>
const FLASH_AT = 11.85;
const SECOND_AT = 24.45;
const ACCENTS = [31.0, 37.5, 44.15, 50.35, 56.9, 66.9, 73.25, 79.75, 86.5, 93.0, 99.55, 106.1, 115.85, 122.4, 128.9, 135.45, 145.05, 151.6, 158.1, 164.85, 171.35, 177.9, 184.4, 194.2, 200.75, 207.25, 213.8, 223.4, 229.95, 236.45, 243.2, 249.7, 259.5, 266.05, 272.55, 278.9, 285.7, 291.95, 298.5, 308.5, 314.8];
const SPIN_TIME = 1.8;
const QUOTE = "\u201CDenial is a river in Egypt.\u201D";
const TYPE_START = 1.2, TYPE_END = 7.2, WHO_AT = 8.2, QUOTE_OUT = 10.6;

const quoteEl = document.getElementById("quote");
const line = document.getElementById("line");
const who = document.getElementById("who");
const chars = [...QUOTE].map(ch => {
  const s = document.createElement("span");
  s.textContent = ch;
  line.appendChild(s);
  return s;
});
const caret = document.createElement("i");
caret.className = "caret";
line.appendChild(caret);
let shown = 0;

const body = document.body;
const music = document.getElementById("music");
const frame = document.getElementById("frame");
const frame2 = document.getElementById("frame2");
const truth2 = document.getElementById("truth2");
let second = false;
const flash = document.getElementById("flash");
const truth = document.getElementById("truth");

let began = false, revealed = false, revealT = 0, audioOn = false, trying = false;
let t0 = performance.now();

if (truth.decode) truth.decode().catch(() => {});
if (truth2.decode) truth2.decode().catch(() => {});

const elapsed = () => (performance.now() - t0) / 1000;
const clock = () => audioOn ? music.currentTime : elapsed();

function tryAudio() {
  if (audioOn || trying) return;
  trying = true;
  const at = elapsed();
  if (at > 0.3 && music.duration && at < music.duration) {
    try { music.currentTime = at; } catch (e) {}
  }
  const p = music.play();
  const ok = () => {
    trying = false;
    audioOn = Math.abs(music.currentTime - elapsed()) < 1.5;
    if (!audioOn) { music.pause(); try { music.currentTime = elapsed(); } catch (e) {} music.play().then(() => { audioOn = Math.abs(music.currentTime - elapsed()) < 1.5; }, () => {}); }
  };
  const no = () => { trying = false; };
  if (p && p.then) p.then(ok, no); else ok();
}

const beginBtn = document.getElementById("begin");
const pupils = beginBtn.querySelectorAll(".pupil");
window.addEventListener("pointermove", e => {
  if (began) return;
  pupils.forEach(p => {
    const r = p.parentElement.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy) || 1, m = Math.min(1, d / 120) * (r.width / 2 - 13);
    p.style.transform = `translate(${dx / d * m}px, ${dy / d * m}px)`;
  });
});
beginBtn.addEventListener("click", () => {
  if (began) return;
  began = true;
  beginBtn.classList.add("gone");
  body.classList.add("began");
  try { music.currentTime = 0; } catch (e) {}
  t0 = performance.now();
  tryAudio();
  setTimeout(() => beginBtn.parentElement.remove(), 800);
});

function reveal() {
  revealed = true;
  revealT = performance.now();
  flash.classList.add("go");
  setTimeout(() => {
    body.classList.add("revealed", "shake");
    frame.classList.add("on");
    setTimeout(() => body.classList.remove("shake"), 500);
  }, 60);
}

function bringSecond() {
  second = true;
  flash.classList.remove("go");
  void flash.offsetWidth;
  flash.classList.add("go2");
  setTimeout(() => {
    frame2.classList.add("on");
    body.classList.add("shake");
    setTimeout(() => body.classList.remove("shake"), 500);
  }, 50);
}

const clamp01 = x => Math.max(0, Math.min(1, x));
const easeIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeBack = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const mix = (p, q, k) => { const o = {}; for (const key in p) o[key] = lerp(p[key], q[key], k); return o; };
const apply = (el, p) => {
  el.style.transform = `translate3d(${p.x}px, ${p.y}px, ${p.z}px) rotateX(${p.rx}deg) rotateY(${p.ry}deg) rotateZ(${p.rz}deg) scale(${p.s})`;
};

function soloPose(t) {
  const ease = Math.min(1, t / 4);
  return {
    x: innerWidth * 0.018 * Math.sin(t * 0.11) * ease,
    y: innerHeight * 0.012 * Math.sin(t * 0.15 + 2) * ease,
    z: 0,
    rx: 4 * Math.sin(t * 0.17 + 1.2) * ease,
    ry: 9 * Math.sin(t * 0.23) * ease,
    rz: 1.2 * Math.sin(t * 0.13 + 0.4) * ease,
    s: 0.94 + 0.06 * (1 - Math.exp(-t / 2)) + 0.03 * Math.sin(t * 0.09)
  };
}

function duoState(mt) {
  let A = -Math.PI / 2 + 0.12 * (mt - SECOND_AT), flip = 0;
  ACCENTS.forEach((a, i) => {
    if (mt <= a) return;
    const e = easeIO(clamp01((mt - a) / SPIN_TIME));
    const kind = i % 3;
    if (kind === 0) A += 2 * Math.PI * e * (Math.floor(i / 3) % 2 ? -1 : 1);
    else if (kind === 1) flip += 360 * e;
    else A += Math.PI * e;
  });
  return { A, flip };
}

function duoPose(mt, i, st) {
  const a = st.A + i * Math.PI;
  const R = Math.min(innerWidth * 0.24, innerHeight * 0.42);
  return {
    x: R * Math.sin(a),
    y: innerHeight * 0.015 * Math.sin(mt * 0.5 + i * 2),
    z: 260 * Math.cos(a),
    rx: 4 * Math.sin(mt * 0.3 + i),
    ry: -28 * Math.sin(a) + st.flip * (i ? -1 : 1),
    rz: 2 * Math.sin(mt * 0.4 + i * 1.7),
    s: 0.7 + 0.03 * Math.sin(mt * 0.2 + i)
  };
}

const ENTRY = { x: 0, y: 0, z: -1400, rx: 0, ry: 180, rz: 0, s: 0.4 };

function loop(now) {
  const mt = clock();
  if (began && !revealed) {
    const n = Math.max(0, Math.min(chars.length, Math.floor((mt - TYPE_START) / (TYPE_END - TYPE_START) * chars.length) + 1));
    caret.classList.toggle("blink", mt >= TYPE_START - 0.4 && mt < WHO_AT + 1);
    while (shown < n) chars[shown++].classList.add("on");
    who.classList.toggle("on", mt >= WHO_AT);
    quoteEl.classList.toggle("gone", mt >= QUOTE_OUT);
    if (mt >= FLASH_AT) reveal();
  }
  if (revealed && !second && mt >= SECOND_AT) bringSecond();
  if (revealed) {
    const solo = soloPose((now - revealT) / 1000);
    if (!second) {
      apply(frame, solo);
    } else {
      const st = duoState(mt);
      const k = easeIO(clamp01((mt - SECOND_AT) / 2.4));
      const k2 = easeBack(clamp01((mt - SECOND_AT) / 2.4));
      apply(frame, mix(solo, duoPose(mt, 0, st), k));
      apply(frame2, mix(ENTRY, duoPose(mt, 1, st), k2));
    }
  }
  requestAnimationFrame(loop);
}

["pointerdown", "keydown", "touchstart"].forEach(ev =>
  window.addEventListener(ev, () => { if (began) tryAudio(); }, { passive: true }));
requestAnimationFrame(loop);
</script>
</body>
</html>
