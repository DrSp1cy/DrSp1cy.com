<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>drsp1cy</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000'/><ellipse cx='50' cy='50' rx='34' ry='20' fill='%23efe9dc'/><circle cx='50' cy='50' r='13' fill='%23b3262e'/><circle cx='50' cy='50' r='6' fill='%23000'/></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  img { -webkit-user-drag: none; user-select: none; pointer-events: none; display: block; }
  body.wait, body.wait * { cursor: wait !important; }

  #scene {
    position: fixed; inset: 0;
    transform-origin: 0 0;
    transition: transform 1.15s cubic-bezier(.65, 0, .25, 1);
    opacity: 0;
  }
  #scene.ready { opacity: 1; transition: transform 1.15s cubic-bezier(.65, 0, .25, 1), opacity 1.6s ease; }

  .layer { position: absolute; left: 0; will-change: transform; }
  .layer > img { width: 100%; height: 100%; }

  .lampglow {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 196, 120, .22), rgba(255, 170, 90, .06) 45%, transparent 70%);
    mix-blend-mode: screen;
    animation: lamp 11s infinite;
    pointer-events: none;
  }
  @keyframes lamp {
    0%, 100% { opacity: 1; }
    38% { opacity: 1; } 38.6% { opacity: .25; } 39.2% { opacity: 1; }
    39.8% { opacity: .5; } 40.4% { opacity: 1; }
    81% { opacity: 1; } 81.4% { opacity: .15; } 82.4% { opacity: 1; }
  }

  .hot { position: absolute; cursor: pointer; }

  #screen { position: absolute; overflow: hidden; background: #000; }
  .glass {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 35% 28%, rgba(255,255,255,.06), transparent 55%);
    pointer-events: none;
    z-index: 5;
  }
  #screen .crt {
    position: absolute; inset: 0;
    background: #000;
    opacity: 0;
    transform: scale(1, .004);
    filter: brightness(3);
  }
  #screen.on .crt { animation: crtOn .55s cubic-bezier(.2, .8, .3, 1) forwards, hum 3.2s 0.6s infinite; }
  #screen.on.instant .crt { animation: hum 3.2s infinite; opacity: 1; transform: none; filter: none; }
  #screen.off .crt { animation: crtOff .35s ease-in forwards; }
  @keyframes crtOn {
    0%   { opacity: 1; transform: scale(1, .004); filter: brightness(4); }
    45%  { opacity: 1; transform: scale(1, .004); filter: brightness(4); }
    70%  { transform: scale(1, 1.06); filter: brightness(1.6); }
    100% { opacity: 1; transform: scale(1, 1); filter: brightness(1); }
  }
  @keyframes crtOff {
    0%   { opacity: 1; transform: scale(1, 1); filter: brightness(1); }
    55%  { opacity: 1; transform: scale(1, .006); filter: brightness(4); }
    80%  { opacity: 1; transform: scale(.02, .006); filter: brightness(6); }
    100% { opacity: 0; transform: scale(0, 0); filter: brightness(6); }
  }
  @keyframes hum {
    0%, 100% { filter: brightness(1); }
    47% { filter: brightness(1); } 48% { filter: brightness(.9); } 49% { filter: brightness(1.04); }
  }

  #screenGlow {
    position: absolute;
    pointer-events: none;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(150, 180, 240, .2), transparent 65%);
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity .6s ease;
  }
  #screenGlow.on { opacity: 1; }

  .led {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    background: #2b2a25;
    box-shadow: 0 0 0 1px rgba(0,0,0,.35);
    transition: background .2s, box-shadow .2s;
  }
  .led.on { background: #9dff6b; box-shadow: 0 0 6px 2px rgba(140, 255, 90, .65); }

  .vignette {
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 55%, transparent 40%, rgba(0,0,0,.72) 100%);
    transition: opacity 1s;
  }
  .grain {
    position: fixed; inset: 0;
    pointer-events: none;
    opacity: .07;
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  body.zoomed #scene { cursor: zoom-out; }
  body.zoomed #screenHit { pointer-events: none; }
  body.zoomed .layer { will-change: auto; }
  body.zoomed .vignette { opacity: 1; background: radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(0,0,0,.8) 100%); }

  #blackout {
    position: fixed; inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity .7s ease;
  }
  #blackout.on { opacity: 1; }

  /* ---------- the computer ---------- */
  #os {
    position: absolute; left: 0; top: 0;
    width: 560px; height: 415px;
    transform-origin: 0 0;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Tahoma, Verdana, "Segoe UI", sans-serif;
    font-size: 11px;
    pointer-events: none;
    cursor: default;
  }
  #os.live { pointer-events: auto; }
  .crt .scan {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 100;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,.42) 100%);
  }
  #os svg { display: block; }
  .view { position: absolute; inset: 0; display: none; }
  .view.active { display: block; animation: vin .35s ease; }
  @keyframes vin { from { opacity: 0; } to { opacity: 1; } }

  .post {
    background: #000;
    padding: 18px 20px;
    font-family: "Lucida Console", "Courier New", monospace;
    font-size: 12px;
    line-height: 1.5;
    color: #b9b9b9;
  }
  .post .pl { white-space: pre; }
  .post .badge { position: absolute; right: 20px; top: 16px; width: 54px; opacity: .85; }

  .splash { background: #000; }
  .splash .mid {
    position: absolute; left: 50%; top: 46%;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center;
  }
  .splash .mid svg { width: 96px; }
  .wordmark {
    margin-top: 10px;
    font: italic bold 28px "Franklin Gothic Medium", "Trebuchet MS", Arial, sans-serif;
    letter-spacing: .5px;
    color: #f1efe9;
  }
  .wordmark b { color: #d0353d; }
  .bar {
    margin-top: 34px;
    width: 120px; height: 16px;
    border: 2px solid #9a9a9a;
    border-radius: 5px;
    overflow: hidden;
    position: relative;
  }
  .bar i {
    position: absolute; top: 2px;
    width: 8px; height: 8px;
    border-radius: 1px;
    background: linear-gradient(#a6c3ff, #2556d8 60%, #1640b0);
    animation: slide 1.5s linear infinite;
  }
  .bar i:nth-child(2) { animation-delay: .09s; }
  .bar i:nth-child(3) { animation-delay: .18s; }
  @keyframes slide { from { left: -34px; } to { left: 124px; } }

  .lg-top, .lg-bot { position: absolute; left: 0; right: 0; height: 62px; background: #00309c; }
  .lg-top { top: 0; box-shadow: 0 2px 0 #8fb0f2; }
  .lg-bot { bottom: 0; box-shadow: 0 -2px 0 #f0953f; }
  .lg-mid {
    position: absolute; top: 64px; bottom: 64px; left: 0; right: 0;
    background: radial-gradient(circle at 18% 12%, #97b5f2, #5a7edc 45%, #4469cc);
    display: flex; align-items: center;
  }
  .lg-left { width: 50%; text-align: right; padding-right: 22px; }
  .lg-left svg { width: 70px; display: inline-block !important; }
  .lg-left .wordmark { font-size: 22px; margin-top: 4px; }
  .lg-div { width: 1px; height: 70%; background: linear-gradient(transparent, #d6e2fa, transparent); }
  .lg-right { width: 50%; padding-left: 20px; }
  .user {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 6px; width: 220px;
    border-radius: 6px;
    cursor: pointer;
  }
  .user.sel { background: linear-gradient(90deg, #0b3aa6, rgba(11,58,166,0)); cursor: default; }
  .avatar {
    width: 48px; height: 48px; flex: none;
    border-radius: 5px;
    border: 2px solid #fff;
    background: #141414;
    display: grid; place-items: center;
    transition: border-color .15s;
  }
  .avatar svg { width: 38px; }
  .user:hover .avatar, .user.sel .avatar { border-color: #ffcf55; }
  .uname { font-size: 15px; margin-top: 4px; text-shadow: 1px 1px 1px rgba(0,0,0,.35); }
  .pw { display: none; margin-top: 6px; align-items: center; gap: 5px; }
  .user.sel .pw { display: flex; }
  .pwbox {
    width: 120px; height: 19px;
    background: #fff; color: #000;
    border: 1px solid #1c3f9a; border-radius: 2px;
    font-size: 10px; line-height: 17px; letter-spacing: 2px;
    padding: 0 4px; overflow: hidden;
  }
  .go {
    width: 21px; height: 21px;
    border-radius: 4px;
    border: 1px solid #fff;
    background: linear-gradient(#73da62, #2a9a26 60%, #1f7e1d);
    cursor: pointer;
    position: relative;
  }
  .go::after {
    content: ""; position: absolute; left: 7px; top: 5px;
    border-left: 7px solid #fff;
    border-top: 4.5px solid transparent;
    border-bottom: 4.5px solid transparent;
  }
  .go:disabled { opacity: .45; cursor: default; }
  .go:not(:disabled) { animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } 50% { box-shadow: 0 0 0 3px rgba(255,255,255,.35); } }
  .pwr {
    position: absolute; left: 18px; top: 18px;
    width: 26px; height: 26px;
    border-radius: 5px;
    border: 1px solid #fff;
    background: linear-gradient(#ff8a52, #d63e12);
    cursor: pointer;
    display: grid; place-items: center;
  }
  .pwr svg { width: 15px; }
  .center-msg {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font: italic bold 34px Tahoma, Verdana, sans-serif;
    text-shadow: 2px 2px 3px rgba(0,0,30,.4);
  }
  .center-msg.small { font-size: 16px; font-style: normal; font-weight: normal; }
  .center-msg svg { width: 46px; }

  .wall { position: absolute; inset: 0; }
  .wall svg { width: 100%; height: 100%; }
  .icons {
    position: absolute; left: 6px; top: 8px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .icon {
    width: 72px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer;
  }
  .icon .ico { width: 36px; height: 36px; }
  .icon .ico svg { width: 100%; height: 100%; }
  .icon span {
    font-size: 11px; line-height: 13px; text-align: center;
    padding: 0 2px;
    text-shadow: 1px 1px 1px #000;
    color: #fff;
  }
  .icon.sel .ico { filter: brightness(.75) sepia(1) hue-rotate(180deg) saturate(2.5); }
  .icon.sel span { background: #316ac5; text-shadow: none; outline: 1px dotted #fff; }

  .wins { position: absolute; left: 0; top: 0; right: 0; bottom: 26px; pointer-events: none; }
  .win {
    position: absolute;
    display: flex; flex-direction: column;
    background: #0a55e0;
    padding: 0 3px 3px;
    border-radius: 7px 7px 0 0;
    box-shadow: 2px 3px 9px rgba(0,0,0,.45);
    color: #000;
    pointer-events: auto;
  }
  .tb {
    height: 23px; flex: none;
    margin: 0 -3px;
    padding: 0 3px 0 7px;
    display: flex; align-items: center; gap: 6px;
    border-radius: 7px 7px 0 0;
    background: linear-gradient(#3d95ff, #0058ee 12%, #0055e8 50%, #0467fa 88%, #0054e3);
    color: #fff;
    font-weight: bold; font-size: 12px;
    text-shadow: 1px 1px #0b2a8a;
    white-space: nowrap; overflow: hidden;
    cursor: default;
  }
  .tb .ti { width: 15px; height: 15px; flex: none; }
  .tb .tt { overflow: hidden; text-overflow: ellipsis; }
  .win.inactive, .win.inactive .tb { filter: saturate(.45) brightness(1.12); }
  .x {
    margin-left: auto; flex: none;
    width: 19px; height: 19px;
    border-radius: 3px;
    border: 1px solid #fff;
    background: linear-gradient(#ee8a62, #cf4316 60%, #b83510);
    position: relative;
    cursor: pointer;
  }
  .x::before, .x::after {
    content: ""; position: absolute; left: 7.5px; top: 3px;
    width: 2px; height: 11px; background: #fff;
    transform: rotate(45deg);
  }
  .x::after { transform: rotate(-45deg); }
  .wb { flex: 1; background: #fff; overflow: auto; position: relative; }
  .ws {
    flex: none; height: 18px;
    background: #ece9d8;
    border-top: 1px solid #c8c4b0;
    font-size: 11px; line-height: 17px;
    padding: 0 6px;
  }
  .folder { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; }
  .folder .icon span { color: #000; text-shadow: none; }
  .folder .icon.sel span { color: #fff; }
  .np {
    padding: 4px 6px;
    font: 12px "Lucida Console", "Courier New", monospace;
    white-space: pre-wrap;
  }

  .taskbar {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 26px;
    display: flex;
    background: linear-gradient(#3f8cf3, #2a62dc 9%, #245ad8 50%, #2257d5 88%, #1c48b8);
    z-index: 40;
  }
  .startbtn {
    height: 26px;
    padding: 0 16px 0 7px;
    display: flex; align-items: center; gap: 4px;
    border: none;
    border-radius: 0 11px 11px 0;
    background: linear-gradient(#67b65a, #3e9b3a 18%, #2f8a2e 80%, #2b7a2a);
    box-shadow: inset -1px 0 2px rgba(0,0,0,.35), 1px 0 2px rgba(0,0,0,.3);
    color: #fff;
    font: italic bold 15px "Franklin Gothic Medium", "Trebuchet MS", Arial, sans-serif;
    text-shadow: 1px 1px 1px rgba(0,0,0,.5);
    cursor: pointer;
  }
  .startbtn svg { width: 20px; }
  .startbtn.down { background: linear-gradient(#2b7a2a, #2f8a2e 20%, #3e9b3a); }
  .tasks { flex: 1; display: flex; gap: 3px; padding: 3px 6px; overflow: hidden; }
  .task {
    width: 118px; height: 20px;
    display: flex; align-items: center; gap: 4px;
    padding: 0 6px;
    border-radius: 3px;
    background: #3c81f3;
    border: 1px solid #1a47b0;
    color: #fff; font-size: 11px;
    white-space: nowrap; overflow: hidden;
    cursor: pointer;
  }
  .task svg { width: 14px; height: 14px; flex: none; }
  .task span { overflow: hidden; text-overflow: ellipsis; }
  .task.active { background: #1d4fb6; box-shadow: inset 1px 1px 2px rgba(0,0,0,.4); }
  .tray {
    padding: 0 11px;
    display: flex; align-items: center;
    background: linear-gradient(#1aa0f0, #0f8de6 12%, #0c84df 88%, #0a72c8);
    border-left: 1px solid #0f3c8f;
    box-shadow: inset 1px 0 1px rgba(255,255,255,.25);
    font-size: 11px;
  }

  .startmenu {
    position: absolute; left: 0; bottom: 26px;
    width: 236px;
    border-radius: 7px 7px 0 0;
    overflow: hidden;
    background: #fff;
    border: 1px solid #1c50c5;
    box-shadow: 2px 2px 9px rgba(0,0,0,.5);
    display: none;
    z-index: 60;
    color: #000;
  }
  .startmenu.open { display: block; animation: vin .15s ease; }
  .sm-head {
    height: 50px;
    display: flex; align-items: center; gap: 9px;
    padding: 0 8px;
    background: linear-gradient(#2a7ae6, #0f5fcb 15%, #1e6ad6 85%, #2b74da);
    color: #fff; font-weight: bold; font-size: 14px;
    text-shadow: 1px 1px 1px rgba(0,0,0,.4);
  }
  .sm-head .avatar { width: 38px; height: 38px; }
  .sm-head .avatar svg { width: 30px; }
  .sm-body { padding: 5px 0; }
  .smi { display: flex; align-items: center; gap: 9px; padding: 5px 10px; cursor: pointer; }
  .smi svg { width: 26px; height: 26px; }
  .smi:hover { background: #316ac5; color: #fff; }
  .sm-sep { height: 1px; margin: 4px 8px; background: linear-gradient(90deg, transparent, #b8c8e8, transparent); }
  .sm-foot {
    height: 36px;
    display: flex; align-items: center; justify-content: flex-end; gap: 12px;
    padding: 0 10px;
    background: linear-gradient(#3e86e2, #2866d0);
    color: #fff;
  }
  .smb { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .smb i {
    width: 22px; height: 22px;
    border-radius: 4px;
    border: 1px solid #fff;
    display: grid; place-items: center;
  }
  .smb i svg { width: 13px; }
  .smb.lo i { background: linear-gradient(#f6c35c, #df9416); }
  .smb.off i { background: linear-gradient(#ff8a52, #d63e12); }
  .smb:hover span { text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    .lampglow { animation: none; }
  }
</style>
</head>

<div id="scene">
  <div class="layer" id="room">
    <img src="background.png" alt="" id="roomImg">
    <div class="lampglow" data-box="420,180,380,460"></div>
  </div>

  <div class="layer" id="desk">
    <div id="screen" data-box="1668,543,235,177">
      <div class="crt">
        <div id="os">

          <div class="view" data-v="off"></div>
          <div class="view" data-v="black"></div>

          <div class="view post" data-v="post">
            <svg class="badge" viewBox="0 0 100 60"><use href="#i-eye"/></svg>
            <div class="lines"></div>
          </div>

          <div class="view splash" data-v="splash">
            <div class="mid">
              <svg viewBox="0 0 100 60"><use href="#i-eye"/></svg>
              <div class="wordmark">DrSp<b>1</b>cy</div>
              <div class="bar"><i></i><i></i><i></i></div>
            </div>
          </div>

          <div class="view" data-v="login">
            <div class="lg-top"></div>
            <div class="lg-mid">
              <div class="lg-left">
                <svg viewBox="0 0 100 60"><use href="#i-eye"/></svg>
                <div class="wordmark">DrSp<b>1</b>cy</div>
              </div>
              <div class="lg-div"></div>
              <div class="lg-right">
                <div class="user" id="userTile">
                  <div class="avatar"><svg viewBox="0 0 100 60"><use href="#i-eye"/></svg></div>

<script>
const WORLD_W = 3200, WORLD_H = 1080;
const START_X = () => (innerWidth / Math.max(innerHeight / 1080, innerWidth / 3200) < 1200 ? 1790 : 1690);
const PARALLAX = 0.86;
const OS_W = 560;
const SAVE_KEY = "ds-screen";

const $ = (q, el = document) => el.querySelector(q);
const scene = $("#scene"), room = $("#room"), desk = $("#desk");
const screenEl = $("#screen"), crt = $("#screen .crt"), osEl = $("#os");
const glow = $("#screenGlow"), tower = $("#tower");
const leds = [$("#ledMon"), $("#ledTower")];
const blackout = $("#blackout"), screenHit = $("#screenHit");
const MAX_MAG = 2.8;
const SCREEN_BOX = screenEl.dataset.box.split(",").map(Number);
const OS_BOX = [1681, 556, 208, 154];

let s = 1, viewW = 0, viewH = 0, maxCam = 0, topOff = 0;
let cam = 0, target = 0;
let powered = false, zoomed = false, busy = false, zt = 0;

function layout() {
  viewW = innerWidth; viewH = innerHeight;
  s = Math.max(viewH / WORLD_H, viewW / WORLD_W);
  topOff = viewH - WORLD_H * s;
  maxCam = Math.max(0, WORLD_W - viewW / s);
  for (const L of [room, desk]) {
    L.style.width = WORLD_W * s + "px";
    L.style.height = WORLD_H * s + "px";
    L.style.top = topOff + "px";
  }
  document.querySelectorAll("[data-box]").forEach(el => {
    const [x, y, w, h] = el.dataset.box.split(",").map(Number);
    el.style.left = x * s + "px";
    el.style.top = y * s + "px";
    el.style.width = w * s + "px";
    el.style.height = h * s + "px";
  });
  osEl.style.left = (OS_BOX[0] - SCREEN_BOX[0]) * s + "px";
  osEl.style.top = (OS_BOX[1] - SCREEN_BOX[1]) * s + "px";
  osEl.style.transform = `scale(${OS_BOX[2] * s / OS_W})`;
  target = clampCam(target);
  cam = clampCam(cam);
  render();
}
const clampCam = c => { const half = (viewW / s) / 2; return Math.max(half, Math.min(half + maxCam, c)); };
const camLeft = c => Math.max(0, Math.min(maxCam, c - (viewW / s) / 2));
function render() {
  const left = camLeft(cam);
  const startLeft = camLeft(START_X());
  const roomLeft = Math.max(0, Math.min(maxCam, startLeft + (left - startLeft) * PARALLAX));
  desk.style.transform = `translate3d(${-left * s}px,0,0)`;
  room.style.transform = `translate3d(${-roomLeft * s}px,0,0)`;
}

const EDGE = 0.22, MAX_SPEED = 1500;
let mouseX = null, lastT = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (!zoomed && !busy) {
    if (mouseX !== null && !drag) {
      const t = mouseX / viewW;
      let v = 0;
      if (t < EDGE) v = -Math.pow((EDGE - t) / EDGE, 1.6);
      else if (t > 1 - EDGE) v = Math.pow((t - (1 - EDGE)) / EDGE, 1.6);
      if (v) target = clampCam(target + v * MAX_SPEED * dt);
    }
    cam += (target - cam) * Math.min(1, dt * 7);
    render();
  }
  requestAnimationFrame(tick);
}

const canHover = matchMedia("(hover: hover) and (pointer: fine)").matches;
let firstMouse = null;
window.addEventListener("pointermove", e => {
  if (!canHover || e.pointerType !== "mouse") { mouseX = null; return; }
  if (!firstMouse) { firstMouse = { x: e.clientX, y: e.clientY }; return; }
  if (firstMouse !== true && Math.hypot(e.clientX - firstMouse.x, e.clientY - firstMouse.y) < 4) return;
  firstMouse = true;
  mouseX = e.clientX;
});
document.addEventListener("mouseleave", () => { mouseX = null; });
window.addEventListener("blur", () => { mouseX = null; });

let drag = null;
window.addEventListener("pointerdown", e => {
  if (zoomed || e.pointerType === "mouse") return;
  drag = { x: e.clientX, cam: target, moved: false, t: performance.now(), v: 0, lx: e.clientX };
});
window.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 6) drag.moved = true;
  const now = performance.now();
  drag.v = (e.clientX - drag.lx) / Math.max(1, now - drag.t);
  drag.lx = e.clientX; drag.t = now;
  target = clampCam(drag.cam - dx / s);
  cam = target;
  render();
});
window.addEventListener("pointerup", () => {
  if (!drag) return;
  if (drag.moved) target = clampCam(target - drag.v * 260 / s);
  window._lastDragMoved = drag.moved;
  drag = null;
  setTimeout(() => { window._lastDragMoved = false; }, 0);
});

const audio = (() => {
  let ctx = null, humGain = null;
  function ensure() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      humGain = ctx.createGain();
      humGain.gain.value = 0;
      humGain.connect(ctx.destination);
      [[60, .5], [120, .25], [180, .08]].forEach(([f, v]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = f; g.gain.value = v;
        o.connect(g).connect(humGain); o.start();
      });
    } catch (e) {}
  }
  function noise(dur, freq, vol, q = 4) {
    if (!ctx) return;
    const t = ctx.currentTime;
    const b = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = b; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
    src.connect(f).connect(g).connect(ctx.destination);
    src.start(t);
  }
  function tone(freq, start, dur, vol, type = "sine") {
    if (!ctx) return;
    const t = ctx.currentTime + start;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + .025);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + dur + .05);
  }
  function chord(notes, step, dur) {
    notes.forEach((f, i) => {
      tone(f, i * step, dur, .07);
      tone(f * 2.003, i * step, dur * .6, .018, "triangle");
    });
  }
  return {
    ensure,
    click() { ensure(); noise(.05, 2400, .5, 2); setTimeout(() => noise(.04, 1500, .35, 2), 70); },
    thunk() { ensure(); noise(.5, 90, .9, 1); },
    tap() { ensure(); noise(.03, 3200, .18, 3); },
    beep() { ensure(); tone(880, 0, .16, .05, "square"); },
    chime() { ensure(); chord([392, 587.33, 523.25, 772], .17, 1.9); },
    logoff() { ensure(); chord([772, 587.33, 523.25, 392], .2, 1.6); },
    hum(on) {
      if (!ctx) return;
      humGain.gain.cancelScheduledValues(ctx.currentTime);
      humGain.gain.setTargetAtTime(on ? .018 : 0, ctx.currentTime, on ? .4 : .08);
    }
  };
})();

  const show = name => { for (const k in views) views[k].classList.toggle("active", k === name); };
  const setStage = st => { stage = st; hooks.save(); };

  const POST = [
    [0, "DS-BIOS v0.07"],
    [160, "CPU : ??? @ 3.66 MHz"],
    [320,
