<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>drsp1cy</title>
<meta name="description" content="Something is being built here.">
<meta name="theme-color" content="#050506">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='30' fill='none' stroke='%23b3262e' stroke-width='6'/><circle cx='50' cy='50' r='6' fill='%23b3262e'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050506;
    --text: #cfc8bd;
    --dim: #5d5852;
    --faint: #2a2725;
    --line: #1c1a19;
    --blood: #b3262e;
    --glow: rgba(179, 38, 46, .35);
    --x: 50vw;
    --y: 40vh;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }

  body {
    color: var(--text);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
    cursor: crosshair;
  }

  /* ---------- atmosphere ---------- */
  .fog {
    position: fixed; inset: -20%;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse 40% 30% at 30% 40%, rgba(120, 110, 100, .06), transparent 70%),
      radial-gradient(ellipse 35% 25% at 70% 65%, rgba(179, 38, 46, .04), transparent 70%);
    animation: drift 40s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate(-4%, -2%) scale(1); }
    to   { transform: translate(4%, 3%) scale(1.1); }
  }

  .grain {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 90;
    opacity: .07;
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* the dark that follows you */
  .dark {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 80;
    background: radial-gradient(circle 340px at var(--x) var(--y),
      transparent 0%, rgba(5,5,6,.55) 55%, rgba(5,5,6,.9) 100%);
    transition: opacity 1.5s;
  }
  @media (hover: none) { .dark { opacity: .35; } }

  /* ---------- layout ---------- */
  .wrap {
    position: relative;
    z-index: 10;
    max-width: 1000px;
    margin: 0 auto;
    padding: 14vh 28px 80px;
  }

  header { text-align: center; margin-bottom: 14vh; }

  .eye {
    width: 54px; height: 54px;
    margin: 0 auto 36px;
    border: 1px solid var(--blood);
    border-radius: 50%;
    display: grid; place-items: center;
    box-shadow: 0 0 30px var(--glow);
    animation: breathe 6s ease-in-out infinite;
  }
  .eye::after {
    content: "";
    width: 8px; height: 8px;
    background: var(--blood);
    border-radius: 50%;
    transform: translate(var(--px, 0), var(--py, 0));
    transition: transform .3s ease-out;
  }
  @keyframes breathe {
    50% { box-shadow: 0 0 60px var(--glow); }
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(54px, 12vw, 128px);
    letter-spacing: .35em;
    margin-right: -.35em; /* balances the letter-spacing */
    line-height: 1;
    color: var(--text);
    position: relative;
    user-select: none;
  }
  h1 .glitch { display: inline-block; }
  h1.flicker { animation: flicker .4s steps(1); }
  @keyframes flicker {
    0%   { opacity: 1; }
    15%  { opacity: .2; transform: translateX(3px); }
    30%  { opacity: 1; transform: none; }
    45%  { opacity: .4; color: var(--blood); }
    60%  { opacity: 1; color: var(--text); }
  }

  .whisper {
    margin-top: 28px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--dim);
    min-height: 1.4em;
  }
  .caret {
    display: inline-block;
    width: 1px; height: 1em;
    background: var(--blood);
    vertical-align: -2px;
    margin-left: 3px;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- doors ---------- */
  .label {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 11px;
    letter-spacing: .4em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .label::before, .label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--faint), transparent);
  }

  .doors {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }

  .door {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 220px;
    padding: 28px 24px;
    background: var(--bg);
    color: inherit;
    text-decoration: none;
    overflow: hidden;
    transition: background .4s;
  }

  .sigil {
    font-size: 26px;
    color: var(--faint);
    transition: color .4s, text-shadow .4s;
    line-height: 1;
  }

  .door h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 26px;
    letter-spacing: .05em;
  }

  .door p {
    font-size: 12px;
    line-height: 1.7;
    color: var(--dim);
    flex: 1;
  }

  .addr {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: .05em;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .state { font-size: 10px; letter-spacing: .3em; }

  /* open doors */
  a.door:hover { background: #0b0909; }
  a.door:hover .sigil { color: var(--blood); text-shadow: 0 0 20px var(--glow); }
  a.door .state { color: var(--blood); }
  a.door::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    height: 1px; width: 0;
    background: var(--blood);
    box-shadow: 0 0 12px var(--blood);
    transition: width .6s ease;
  }
  a.door:hover::after { width: 100%; }

  /* sealed doors */
  .door.sealed { cursor: not-allowed; }
  .door.sealed h2 { color: var(--faint); letter-spacing: 0; }
  .door.sealed .redact {
    display: inline-block;
    background: var(--faint);
    height: .7em;
    vertical-align: middle;
    border-radius: 1px;
  }
  .door.sealed p { color: var(--faint); }
  .door.sealed .state { color: var(--faint); }
  .door.sealed .msg {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--dim);
    opacity: 0;
    transition: opacity .6s;
    background: rgba(5,5,6,.6);
  }
  .door.sealed:hover .msg { opacity: 1; }

  footer {
    margin-top: 12vh;
    text-align: center;
    font-size: 10px;
    letter-spacing: .4em;
    color: var(--faint);
    text-transform: uppercase;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="fog"></div>
<div class="grain"></div>
<div class="dark" id="dark"></div>

<div class="wrap">
  <header>
    <div class="eye" id="eye"></div>
    <h1 id="title">DRSP1CY</h1>
    <p class="whisper"><span id="whisper"></span><span class="caret"></span></p>
  </header>

  <div class="label" id="label">doors</div>
  <main class="doors" id="doors"></main>

  <footer>you were not here</footer>
</div>

<script>
/* ==========================================================
   DOORS — one entry per subdomain.
   open: true  → clickable, links to https://<sub>.drsp1cy.com
   open: false → sealed slot, name and address hidden
   url:  optional, overrides the subdomain link
   ========================================================== */
const DOMAIN = "drsp1cy.com";

const doors = [
  { sub: "",       name: "Unnamed", desc: "", sigil: "◉", open: false },
  { sub: "",       name: "Unnamed", desc: "", sigil: "△", open: false },
  { sub: "",       name: "Unnamed", desc: "", sigil: "⌖", open: false },
  { sub: "",       name: "Unnamed", desc: "", sigil: "◈", open: false },
  { sub: "",       name: "Unnamed", desc: "", sigil: "☍", open: false },
  { sub: "",       name: "Unnamed", desc: "", sigil: "⟁", open: false },
  // Example of an open door:
  // { sub: "void", name: "The Void", desc: "Stare into it.", sigil: "◉", open: true },
];

/* lines the header types out, one at a time */
const whispers = [
  "something is being built here.",
  "not everything is ready to be seen.",
  "the doors open when they open.",
  "you can leave whenever you like."
];

const sealedMsgs = ["not yet.", "it isn't ready.", "come back later.", "sealed.", "don't."];
/* ========================================================== */

const grid = document.getElementById('doors');
const openCount = doors.filter(d => d.open).length;
document.getElementById('label').textContent =
  `doors · ${openCount} of ${doors.length} open`;

doors.forEach((d, i) => {
  const href = d.url || (d.sub ? `https://${d.sub}.${DOMAIN}` : "");
  const el = document.createElement(d.open && href ? 'a' : 'div');
  el.className = 'door' + (d.open ? '' : ' sealed');
  const num = String(i + 1).padStart(2, '0');

  if (d.open) {
    el.href = href;
    el.innerHTML = `
      <div class="sigil"></div>
      <h2></h2>
      <p></p>
      <div class="addr"><span class="host"></span><span class="state">OPEN</span></div>`;
    el.querySelector('.sigil').textContent = d.sigil || "◉";
    el.querySelector('h2').textContent = d.name;
    el.querySelector('p').textContent = d.desc;
    el.querySelector('.host').textContent = d.url ? d.url.replace(/^https?:\/\//, '') : `${d.sub}.${DOMAIN}`;
  } else {
    const w = 60 + Math.random() * 90;
    el.innerHTML = `
      <div class="sigil"></div>
      <h2><span class="redact" style="width:${w}px"></span></h2>
      <p><span class="redact" style="width:90%"></span><br><span class="redact" style="width:60%"></span></p>
      <div class="addr"><span>???.${DOMAIN}</span><span class="state">SEALED · ${num}</span></div>
      <div class="msg"></div>`;
    el.querySelector('.sigil').textContent = d.sigil || "◉";
    el.addEventListener('mouseenter', () => {
      el.querySelector('.msg').textContent = sealedMsgs[Math.floor(Math.random() * sealedMsgs.length)];
    });
  }
  grid.appendChild(el);
});

/* flashlight + eye tracking */
const root = document.documentElement;
const eye = document.getElementById('eye');
window.addEventListener('pointermove', e => {
  root.style.setProperty('--x', e.clientX + 'px');
  root.style.setProperty('--y', e.clientY + 'px');
  const r = eye.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2);
  const dy = e.clientY - (r.top + r.height / 2);
  const a = Math.atan2(dy, dx);
  const m = Math.min(12, Math.hypot(dx, dy) / 30);
  eye.style.setProperty('--px', Math.cos(a) * m + 'px');
  eye.style.setProperty('--py', Math.sin(a) * m + 'px');
});

/* typed whispers */
const wEl = document.getElementById('whisper');
let wi = 0;
function type(text, i = 0) {
  if (i <= text.length) {
    wEl.textContent = text.slice(0, i);
    setTimeout(() => type(text, i + 1), 45 + Math.random() * 60);
  } else {
    setTimeout(erase, 3200);
  }
}
function erase() {
  const t = wEl.textContent;
  if (t.length) {
    wEl.textContent = t.slice(0, -1);
    setTimeout(erase, 22);
  } else {
    wi = (wi + 1) % whispers.length;
    setTimeout(() => type(whispers[wi]), 700);
  }
}
setTimeout(() => type(whispers[0]), 1200);

/* random title flicker */
const title = document.getElementById('title');
function flicker() {
  title.classList.remove('flicker');
  void title.offsetWidth;
  title.classList.add('flicker');
  setTimeout(flicker, 6000 + Math.random() * 14000);
}
setTimeout(flicker, 5000);

/* type the name anywhere and the lights go out for a moment */
let buf = "";
window.addEventListener('keydown', e => {
  buf = (buf + e.key.toLowerCase()).slice(-7);
  if (buf === "drsp1cy") {
    const dark = document.getElementById('dark');
    dark.style.transition = 'none';
    dark.style.background = '#000';
    setTimeout(() => {
      dark.style.transition = '';
      dark.style.background = '';
      wEl.textContent = "";
      wEl.textContent = "we see you.";
    }, 1400);
  }
});
</script>
</body>
</html>
