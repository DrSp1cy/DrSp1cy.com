<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>drsp1cy</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000'/><ellipse cx='50' cy='50' rx='34' ry='20' fill='%23efe9dc'/><circle cx='50' cy='50' r='13' fill='%23b3262e'/><circle cx='50' cy='50' r='6' fill='%23000'/></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  img { -webkit-user-drag: none; user-select: none; pointer-events: none; display: block; }

  #scene {
    position: fixed; inset: 0;
    transform-origin: 0 0;
    transition: transform 1.15s cubic-bezier(.65, 0, .25, 1);
    opacity: 0;
  }
  #scene.ready { opacity: 1; transition: transform 1.15s cubic-bezier(.65, 0, .25, 1), opacity 1.6s ease; }

  .layer { position: absolute; left: 0; will-change: transform; }
  .layer > img { width: 100%; height: 100%; }

  .lampglow {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 196, 120, .22), rgba(255, 170, 90, .06) 45%, transparent 70%);
    mix-blend-mode: screen;
    animation: lamp 11s infinite;
    pointer-events: none;
  }
  @keyframes lamp {
    0%, 100% { opacity: 1; }
    38% { opacity: 1; } 38.6% { opacity: .25; } 39.2% { opacity: 1; }
    39.8% { opacity: .5; } 40.4% { opacity: 1; }
    81% { opacity: 1; } 81.4% { opacity: .15; } 82.4% { opacity: 1; }
  }

  .hot { position: absolute; cursor: pointer; }

  #screen { overflow: hidden; border-radius: 7% / 9%; }
  #screen .glass {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 35% 28%, rgba(255,255,255,.06), transparent 55%);
    pointer-events: none;
  }
  #screen .crt {
    position: absolute; inset: 0;
    background: #ecebe7;
    display: grid; place-items: center;
    opacity: 0;
    transform: scale(1, .004);
    filter: brightness(3);
  }
  #screen .crt svg { width: 62%; height: auto; opacity: .92; }
  #screen .crt::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.13) 0 1px, transparent 1px 3px);
    pointer-events: none;
    z-index: 2;
  }
  #screen .crt::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.45) 100%);
    pointer-events: none;
    z-index: 3;
    animation: roll 7s linear infinite;
  }
  @keyframes roll {
    0%, 100% { opacity: 1; }
    50% { opacity: .85; }
  }
  #screen.on .crt { animation: crtOn .55s cubic-bezier(.2, .8, .3, 1) forwards, hum 3.2s 0.6s infinite; }
  #screen.off .crt { animation: crtOff .35s ease-in forwards; }
  @keyframes crtOn {
    0%   { opacity: 1; transform: scale(1, .004); filter: brightness(4); }
    45%  { opacity: 1; transform: scale(1, .004); filter: brightness(4); }
    70%  { transform: scale(1, 1.06); filter: brightness(1.6); }
    100% { opacity: 1; transform: scale(1, 1); filter: brightness(1); }
  }
  @keyframes crtOff {
    0%   { opacity: 1; transform: scale(1, 1); filter: brightness(1); }
    55%  { opacity: 1; transform: scale(1, .006); filter: brightness(4); }
    80%  { opacity: 1; transform: scale(.02, .006); filter: brightness(6); }
    100% { opacity: 0; transform: scale(0, 0); filter: brightness(6); }
  }
  @keyframes hum {
    0%, 100% { filter: brightness(1); }
    47% { filter: brightness(1); } 48% { filter: brightness(.9); } 49% { filter: brightness(1.04); }
  }

  #screenGlow {
    position: absolute;
    pointer-events: none;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(225, 235, 240, .22), transparent 65%);
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity .6s ease;
  }
  #screenGlow.on { opacity: 1; }

  .led {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    background: #2b2a25;
    box-shadow: 0 0 0 1px rgba(0,0,0,.35);
    transition: background .2s, box-shadow .2s;
  }
  .led.on { background: #9dff6b; box-shadow: 0 0 6px 2px rgba(140, 255, 90, .65); }

  .vignette {
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 55%, transparent 40%, rgba(0,0,0,.72) 100%);
    transition: opacity 1s;
  }
  .grain {
    position: fixed; inset: 0;
    pointer-events: none;
    opacity: .07;
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  body.zoomed .vignette { opacity: 0; }

  #shade {
    position: fixed; inset: 0;
    display: none;
    cursor: zoom-out;
  }
  body.zoomed #shade { display: block; }

  #pc {
    position: fixed;
    border: 0;
    background: #ecebe7;
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s ease;
    border-radius: 2.2% / 3%;
    box-shadow: 0 0 60px rgba(220, 235, 240, .18);
  }
  #pc.show { opacity: 1; pointer-events: auto; }

  @media (prefers-reduced-motion: reduce) {
    .lampglow, #screen .crt::after { animation: none; }
  }
</style>
</head>
<body>

<div id="scene">
  <div class="layer" id="room">
    <img src="background.png" alt="" id="roomImg">
    <div class="lampglow" data-box="420,180,380,460"></div>
  </div>

  <div class="layer" id="desk">
    <img src="desk.png" alt="" id="deskImg">
    <div id="screenGlow" data-box="1590,470,400,330"></div>
    <div class="hot" id="screen" data-box="1674,542,226,175">
      <div class="crt">
        <svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
          <path d="M30 104 V34 C30 14 60 14 60 34 V80 C60 96 84 96 84 80 V30 C84 10 116 10 116 30 V72 C116 88 140 88 140 72 V36 C140 16 170 16 170 36 V104" fill="none" stroke="#e2482e" stroke-width="5" stroke-linecap="round"/>
          <path d="M40 104 V64 C40 48 56 46 64 60 C74 78 88 80 100 64 C112 48 124 46 134 62 C144 78 156 76 160 62 V104" fill="none" stroke="#1fb0a5" stroke-width="5" stroke-linecap="round"/>
          <rect x="18" y="100" width="164" height="14" rx="4" fill="#ddb07a"/>
          <circle cx="30" cy="50" r="8" fill="#f08a3c"/><circle cx="84" cy="44" r="8" fill="#8a5cc7"/>
          <circle cx="116" cy="58" r="8" fill="#2aa3c9"/><circle cx="64" cy="62" r="8" fill="#f5cf2a"/>
          <circle cx="134" cy="64" r="8" fill="#9bd13c"/><circle cx="170" cy="52" r="8" fill="#5b6b8c"/>
        </svg>
      </div>
      <div class="glass"></div>
    </div>
    <div class="hot" id="tower" data-box="1945,522,185,288"></div>
    <div class="led" id="ledMon" data-box="1868,740,9,9"></div>
    <div class="led" id="ledTower" data-box="2091,694,9,9"></div>
  </div>
</div>

<div class="vignette"></div>
<div class="grain"></div>
<div id="shade"></div>
<iframe id="pc" title="pc" allow="autoplay"></iframe>

<script>
const WORLD_W = 3200, WORLD_H = 1080;
const START_X = () => (innerWidth / Math.max(innerHeight / 1080, innerWidth / 3200) < 1200 ? 1790 : 1690);
const PARALLAX = 0.86;
const PC_URL = "playtime/";

const scene = document.getElementById("scene");
const room = document.getElementById("room");
const desk = document.getElementById("desk");
const screenEl = document.getElementById("screen");
const glow = document.getElementById("screenGlow");
const tower = document.getElementById("tower");
const leds = [document.getElementById("ledMon"), document.getElementById("ledTower")];
const pc = document.getElementById("pc");

let s = 1, viewW = 0, viewH = 0, maxCam = 0, topOff = 0;
let cam = 0, target = 0;
let powered = false, zoomed = false, busy = false;

function layout() {
  viewW = innerWidth; viewH = innerHeight;
  s = Math.max(viewH / WORLD_H, viewW / WORLD_W);
  topOff = viewH - WORLD_H * s;
  maxCam = Math.max(0, WORLD_W - viewW / s);
  for (const L of [room, desk]) {
    L.style.width = WORLD_W * s + "px";
    L.style.height = WORLD_H * s + "px";
    L.style.top = topOff + "px";
  }
  document.querySelectorAll("[data-box]").forEach(el => {
    const [x, y, w, h] = el.dataset.box.split(",").map(Number);
    el.style.left = x * s + "px";
    el.style.top = y * s + "px";
    el.style.width = w * s + "px";
    el.style.height = h * s + "px";
  });
  target = clampCam(target);
  cam = clampCam(cam);
  render();
}
const clampCam = c => { const half = (viewW / s) / 2; return Math.max(half, Math.min(half + maxCam, c)); };

function camLeft(centerX) {
  return Math.max(0, Math.min(maxCam, centerX - (viewW / s) / 2));
}
function render() {
  const left = camLeft(cam);
  const startLeft = camLeft(START_X());
  const roomLeft = Math.max(0, Math.min(maxCam, startLeft + (left - startLeft) * PARALLAX));
  desk.style.transform = `translate3d(${-left * s}px,0,0)`;
  room.style.transform = `translate3d(${-roomLeft * s}px,0,0)`;
}

const EDGE = 0.22;
const MAX_SPEED = 1500;
let mouseX = null, lastT = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (!zoomed && !busy) {
    if (mouseX !== null && !drag) {
      const t = mouseX / viewW;
      let v = 0;
      if (t < EDGE) v = -Math.pow((EDGE - t) / EDGE, 1.6);
      else if (t > 1 - EDGE) v = Math.pow((t - (1 - EDGE)) / EDGE, 1.6);
      if (v) target = clampCam(target + v * MAX_SPEED * dt);
    }
    cam += (target - cam) * Math.min(1, dt * 7);
    render();
  }
  requestAnimationFrame(tick);
}

let pointerType = "mouse";
const canHover = matchMedia("(hover: hover) and (pointer: fine)").matches;
let firstMouse = null;
window.addEventListener("pointermove", e => {
  pointerType = e.pointerType;
  if (!canHover || e.pointerType !== "mouse") { mouseX = null; return; }
  if (!firstMouse) { firstMouse = { x: e.clientX, y: e.clientY }; return; }
  if (firstMouse !== true && Math.hypot(e.clientX - firstMouse.x, e.clientY - firstMouse.y) < 4) return;
  firstMouse = true;
  mouseX = e.clientX;
});
document.addEventListener("mouseleave", () => { mouseX = null; });
window.addEventListener("blur", () => { mouseX = null; });

let drag = null;
window.addEventListener("pointerdown", e => {
  if (zoomed || e.pointerType === "mouse") return;
  drag = { x: e.clientX, cam: target, moved: false, t: performance.now(), v: 0, lx: e.clientX };
});
window.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 6) drag.moved = true;
  const now = performance.now();
  drag.v = (e.clientX - drag.lx) / Math.max(1, now - drag.t);
  drag.lx = e.clientX; drag.t = now;
  const half = (viewW / s) / 2;
  target = Math.max(half, Math.min(half + maxCam, drag.cam - dx / s));
  cam = target;
  render();
});
window.addEventListener("pointerup", () => {
  if (!drag) return;
  if (drag.moved) {
    const half = (viewW / s) / 2;
    target = Math.max(half, Math.min(half + maxCam, target - drag.v * 260 / s));
  }
  window._lastDragMoved = drag.moved;
  drag = null;
  setTimeout(() => { window._lastDragMoved = false; }, 0);
});

const audio = (() => {
  let ctx = null, humGain = null;
  function ensure() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      humGain = ctx.createGain();
      humGain.gain.value = 0;
      humGain.connect(ctx.destination);
      [[60, .5], [120, .25], [180, .08]].forEach(([f, v]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = f; g.gain.value = v;
        o.connect(g).connect(humGain); o.start();
      });
    } catch (e) {}
  }
  function noise(dur, freq, vol, q = 4) {
    if (!ctx) return;
    const t = ctx.currentTime;
    const b = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = b; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
    src.connect(f).connect(g).connect(ctx.destination);
    src.start(t);
  }
  return {
    ensure,
    click() { ensure(); noise(.05, 2400, .5, 2); setTimeout(() => noise(.04, 1500, .35, 2), 70); },
    thunk() { ensure(); noise(.5, 90, .9, 1); },
    hum(on) {
      if (!ctx) return;
      humGain.gain.cancelScheduledValues(ctx.currentTime);
      humGain.gain.setTargetAtTime(on ? .018 : 0, ctx.currentTime, on ? .4 : .08);
    }
  };
})();

function setPower(on) {
  powered = on;
  screenEl.classList.remove("on", "off");
  void screenEl.offsetWidth;
  screenEl.classList.add(on ? "on" : "off");
  glow.classList.toggle("on", on);
  leds.forEach(l => l.classList.toggle("on", on));
  audio.click();
  if (on) setTimeout(() => audio.thunk(), 220);
  audio.hum(on);
}

tower.addEventListener("click", () => {
  if (window._lastDragMoved || zoomed || busy) return;
  setPower(!powered);
});

screenEl.addEventListener("click", () => {
  if (window._lastDragMoved || zoomed || busy) return;
  if (!powered) { setPower(true); return; }
  zoomIn();
});

function zoomIn() {
  busy = true;
  const r = screenEl.getBoundingClientRect();
  const Z = Math.min(viewW * .92 / r.width, viewH * .9 / r.height);
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  scene.style.transform = `translate(${viewW / 2 - cx * Z}px, ${viewH / 2 - cy * Z}px) scale(${Z})`;
  document.body.classList.add("zoomed");
  zoomed = true;
  audio.hum(false);
  setTimeout(() => {
    const w = r.width * Z, h = r.height * Z;
    pc.style.width = w + "px";
    pc.style.height = h + "px";
    pc.style.left = (viewW - w) / 2 + "px";
    pc.style.top = (viewH - h) / 2 + "px";
    if (!pc.src || pc.dataset.loaded !== "1") { pc.src = PC_URL; pc.dataset.loaded = "1"; }
    pc.classList.add("show");
    busy = false;
  }, 1150);
}

function zoomOut() {
  if (!zoomed || busy) return;
  busy = true;
  pc.classList.remove("show");
  setTimeout(() => {
    pc.removeAttribute("src");
    pc.dataset.loaded = "0";
    scene.style.transform = "";
    document.body.classList.remove("zoomed");
    setTimeout(() => {
      zoomed = false; busy = false;
      if (powered) audio.hum(true);
    }, 1150);
  }, 450);
}
document.getElementById("shade").addEventListener("click", zoomOut);
window.addEventListener("keydown", e => { if (e.key === "Escape") zoomOut(); });

window.addEventListener("resize", () => {
  if (zoomed) {
    scene.style.transition = "none";
    pc.classList.remove("show");
    pc.removeAttribute("src"); pc.dataset.loaded = "0";
    scene.style.transform = "";
    document.body.classList.remove("zoomed");
    zoomed = false; busy = false;
    requestAnimationFrame(() => { scene.style.transition = ""; });
  }
  layout();
});

const imgs = [document.getElementById("roomImg"), document.getElementById("deskImg")];
Promise.all(imgs.map(i => i.complete ? Promise.resolve() : new Promise(r => { i.onload = r; i.onerror = r; })))
  .then(() => scene.classList.add("ready"));

layout();
cam = target = clampCam(START_X());
render();
requestAnimationFrame(tick);
</script>
</body>
</html>
