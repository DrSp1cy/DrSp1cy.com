<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>drsp1cy</title>
<meta name="description" content="Projects, experiments, and bad ideas.">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b0b0d'/><circle cx='50' cy='50' r='18' fill='none' stroke='%23c2414b' stroke-width='8'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0d;
    --surface: #131317;
    --surface-2: #1a1a1f;
    --border: #24242b;
    --text: #e6e4e1;
    --muted: #8b8890;
    --faint: #55535b;
    --accent: #c2414b;
    --accent-soft: rgba(194, 65, 75, .12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* faint red glow at the top of the page */
  body::before {
    content: "";
    position: fixed;
    top: -300px; left: 50%;
    width: 900px; height: 600px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(194, 65, 75, .10), transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  a { color: inherit; text-decoration: none; }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- nav ---------- */
  nav {
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(11, 11, 13, .8);
    backdrop-filter: blur(10px);
  }
  nav .container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
  }
  .logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    letter-spacing: .02em;
  }
  .logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 24px; font-size: 14px; color: var(--muted); }
  .nav-links a:hover { color: var(--text); }

  /* ---------- hero ---------- */
  .hero { padding: 96px 0 72px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .hero h1 {
    font-size: clamp(36px, 6vw, 56px);
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -.03em;
    max-width: 680px;
  }
  .hero h1 em {
    font-style: normal;
    color: var(--muted);
  }
  .hero p {
    margin-top: 20px;
    color: var(--muted);
    font-size: 17px;
    max-width: 520px;
  }

  /* ---------- projects ---------- */
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-head h2 { font-size: 15px; font-weight: 500; }
  .section-head span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--faint);
  }

  .projects {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 96px;
  }

  .card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: border-color .2s, background .2s, transform .2s;
    min-height: 170px;
  }
  a.card:hover {
    border-color: #3a2a2d;
    background: var(--surface-2);
    transform: translateY(-2px);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .path {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--faint);
  }
  a.card:hover .path { color: var(--accent); }

  .badge {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 99px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .badge.live { color: #7fd1a0; border-color: rgba(127, 209, 160, .25); background: rgba(127, 209, 160, .06); }
  .badge.wip  { color: #e0b65a; border-color: rgba(224, 182, 90, .25); background: rgba(224, 182, 90, .06); }

  .card h3 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .card p { font-size: 14px; color: var(--muted); flex: 1; }

  .card .arrow {
    font-size: 13px;
    color: var(--faint);
    transition: color .2s, transform .2s;
  }
  a.card:hover .arrow { color: var(--accent); transform: translateX(3px); }

  /* empty slot */
  .card.empty {
    background: transparent;
    border-style: dashed;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--faint);
    font-size: 13px;
  }

  /* ---------- footer ---------- */
  footer {
    margin-top: auto;
    border-top: 1px solid var(--border);
    padding: 28px 0;
    font-size: 13px;
    color: var(--faint);
  }
  footer .container { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

  @media (max-width: 560px) {
    .hero { padding: 64px 0 48px; }
    .nav-links { gap: 16px; }
  }
</style>
</head>
<body>

<nav>
  <div class="container">
    <a href="/" class="logo">drsp<span>1</span>cy</a>
    <div class="nav-links">
      <a href="#projects">Projects</a>
      <a href="#about">About</a>
    </div>
  </div>
</nav>

<main class="container">
  <section class="hero">
    <div class="eyebrow">// projects &amp; experiments</div>
    <h1>Things I built because I wanted to. <em>Not because anyone asked.</em></h1>
    <p>A home for side projects, experiments, and ideas that probably should have stayed ideas.</p>
  </section>

  <section id="projects">
    <div class="section-head">
      <h2>Projects</h2>
      <span id="count"></span>
    </div>
    <div class="projects" id="grid"></div>
  </section>
</main>

<footer id="about">
  <div class="container">
    <span>© <span id="year"></span> drsp1cy</span>
    <span>Built at odd hours.</span>
  </div>
</footer>

<script>
/* =========================================================
   PROJECTS — add one entry per page.
   path:   the folder name, e.g. "thing" → drsp1cy.com/thing/
   status: "live" | "wip" | "soon"
   Set path to "" for a project that isn't linkable yet.
   ========================================================= */
const projects = [
  {
    name: "First Project",
    path: "first",
    desc: "Placeholder for the first page. Rename it once it exists.",
    status: "soon"
  },
];

/* how many dashed "coming soon" slots to show after the real projects */
const EMPTY_SLOTS = 2;
/* ========================================================= */

const grid = document.getElementById('grid');
const labels = { live: "Live", wip: "In progress", soon: "Soon" };

projects.forEach(p => {
  const linkable = p.path && p.status !== "soon";
  const el = document.createElement(linkable ? 'a' : 'div');
  el.className = 'card';
  if (linkable) el.href = `/${p.path}/`;
  el.innerHTML = `
    <div class="card-top">
      <span class="path"></span>
      <span class="badge ${p.status}">${labels[p.status] || p.status}</span>
    </div>
    <h3></h3>
    <p></p>
    ${linkable ? '<span class="arrow">Open →</span>' : ''}`;
  el.querySelector('.path').textContent = p.path ? `/${p.path}` : '/';
  el.querySelector('h3').textContent = p.name;
  el.querySelector('p').textContent = p.desc;
  grid.appendChild(el);
});

for (let i = 0; i < EMPTY_SLOTS; i++) {
  const el = document.createElement('div');
  el.className = 'card empty';
  el.textContent = 'Something goes here eventually.';
  grid.appendChild(el);
}

document.getElementById('count').textContent =
  `${projects.length} project${projects.length === 1 ? '' : 's'}`;
document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
